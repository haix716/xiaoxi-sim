[project]
name = "xiaoxi"
version = "0.1.0"
description = "小犀仿真练习场 — SO-101 MuJoCo 仿真与网页示教台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "mujoco>=3.15",
    "numpy>=2.5",
    "pyarrow>=26",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
